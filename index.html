<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Cá Nhân - Doanh Số & Công Nợ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome cho icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- MÀN HÌNH ĐĂNG NHẬP (Ẩn sau khi đăng nhập thành công) -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <div class="text-center mb-6">
                <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Quản Lý Công Việc & Doanh Số</h1>
                <p class="text-sm text-gray-500 mt-1">Đăng nhập để đồng bộ dữ liệu lên mây</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email Supabase</label>
                    <input type="email" id="email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
                    <input type="password" id="password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">Đăng Nhập</button>
            </form>
            <div id="auth-error" class="mt-4 text-center text-sm text-red-600 hidden"></div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH (Hiện sau khi đăng nhập) -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-briefcase text-xl"></i>
                </div>
                <div>
                    <h2 class="font-bold text-lg text-gray-800">Trang Quản Trị Cá Nhân</h2>
                    <p class="text-xs text-gray-500" id="user-email-display"></p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700 transition flex items-center space-x-2">
                    <i class="fa-solid fa-file-excel"></i><span>Xuất Excel (CSV)</span>
                </button>
                <button onclick="logout()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition">
                    <i class="fa-solid fa-right-from-bracket"></i> Thoát
                </button>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="flex-1 p-6 max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- CỘT 1 & 2: Doanh số & Tiến độ công việc -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Bảng 1: Tiến độ công việc & Tỷ lệ hoàn thành -->
                <div class="bg-white p-6 rounded-xl shadow-sm border">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-gray-800 text-lg"><i class="fa-solid fa-tasks text-blue-600 mr-2"></i> Tiến Độ Công Việc</h3>
                        <span id="task-progress-text" class="text-sm font-semibold text-blue-600">Hoàn thành: 0%</span>
                    </div>
                    <!-- Thanh Progress Bar -->
                    <div class="w-full bg-gray-200 rounded-full h-3 mb-4 overflow-hidden">
                        <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    
                    <!-- Form thêm công việc -->
                    <form id="task-form" class="flex gap-2 mb-4">
                        <input type="text" id="task-title" placeholder="Tên công việc mới..." required class="flex-1 px-3 py-2 border rounded-lg text-sm">
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Thêm</button>
                    </form>

                    <!-- Danh sách task -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 border-b">
                                    <th class="p-3">Công việc</th>
                                    <th class="p-3 text-center">Trạng thái</th>
                                    <th class="p-3 text-right">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="task-list">
                                <!-- Dữ liệu load bằng JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Bảng 2: Doanh số đi làm -->
                <div class="bg-white p-6 rounded-xl shadow-sm border">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-gray-800 text-lg"><i class="fa-solid fa-coins text-amber-500 mr-2"></i> Ghi Nhận Doanh Số</h3>
                        <span class="text-sm font-semibold text-gray-600" id="total-sales">Tổng doanh số: 0 VNĐ</span>
                    </div>

                    <form id="sales-form" class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4">
                        <input type="text" id="sales-client" placeholder="Tên khách hàng / Đại lý" required class="px-3 py-2 border rounded-lg text-sm">
                        <input type="number" id="sales-amount" placeholder="Số tiền (VNĐ)" required class="px-3 py-2 border rounded-lg text-sm">
                        <button type="submit" class="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-amber-700">Thêm Doanh Số</button>
                    </form>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 border-b">
                                    <th class="p-3">Khách hàng</th>
                                    <th class="p-3">Số tiền</th>
                                    <th class="p-3">Ngày ghi nhận</th>
                                    <th class="p-3 text-right">Xóa</th>
                                </tr>
                            </thead>
                            <tbody id="sales-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- CỘT 3: Quản lý Công Nợ & Nhắc nợ -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border">
                    <h3 class="font-bold text-gray-800 text-lg mb-4"><i class="fa-solid fa-file-invoice-dollar text-red-500 mr-2"></i> Quản Lý & Nhắc Công Nợ</h3>
                    
                    <form id="debt-form" class="space-y-3 mb-4">
                        <input type="text" id="debt-client" placeholder="Tên khách hàng nợ" required class="w-full px-3 py-2 border rounded-lg text-sm">
                        <input type="number" id="debt-amount" placeholder="Số tiền nợ (VNĐ)" required class="w-full px-3 py-2 border rounded-lg text-sm">
                        <div>
                            <label class="text-xs text-gray-500">Hạn thanh toán:</label>
                            <input type="date" id="debt-duedate" required class="w-full px-3 py-2 border rounded-lg text-sm mt-1">
                        </div>
                        <button type="submit" class="w-full bg-red-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-red-700">Lưu Công Nợ</button>
                    </form>

                    <!-- Danh sách công nợ & cảnh báo -->
                    <div class="space-y-3 max-h-[450px] overflow-y-auto" id="debt-list">
                        <!-- Load bằng JS -->
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- SCRIPT XỬ LÝ SUPABASE & LOGIC -->
    <script>
        // ================= THAY THẾ THÔNG TIN SUPABASE CỦA BẠN VÀO ĐÂY =================
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        // ==============================================================================

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // Kiểm tra phiên đăng nhập khi tải trang
        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('user-email-display').innerText = currentUser.email;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                loadAllData();
            }
        }

        // Đăng nhập
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('auth-error');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                errDiv.innerText = "Lỗi: " + error.message;
                errDiv.classList.remove('hidden');
            } else {
                location.reload();
            }
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        // Tải toàn bộ dữ liệu từ các bảng Supabase
        async function loadAllData() {
            await fetchTasks();
            await fetchSales();
            await fetchDebts();
        }

        // --- 1. QUẢN LÝ TASKS & TIẾN ĐỘ ---
        async function fetchTasks() {
            const { data, error } = await supabaseClient.from('tasks').select('*').order('id', { ascending: false });
            if (error) return console.error(error);

            const listEl = document.getElementById('task-list');
            listEl.innerHTML = '';
            let completed = 0;

            data.forEach(task => {
                if (task.is_completed) completed++;
                listEl.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 ${task.is_completed ? 'line-through text-gray-400' : ''}">${task.title}</td>
                        <td class="p-3 text-center">
                            <input type="checkbox" ${task.is_completed ? 'checked' : ''} onclick="toggleTask(${task.id}, ${!task.is_completed})" class="w-4 h-4 text-blue-600 rounded">
                        </td>
                        <td class="p-3 text-right">
                            <button onclick="deleteTask(${task.id})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });

            const percent = data.length > 0 ? Math.round((completed / data.length) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('task-progress-text').innerText = `Hoàn thành: ${percent}% (${completed}/${data.length})`;
        }

        document.getElementById('task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const { error } = await supabaseClient.from('tasks').insert([{ title, is_completed: false, user_id: currentUser.id }]);
            if (!error) {
                document.getElementById('task-title').value = '';
                fetchTasks();
            }
        });

        async function toggleTask(id, status) {
            await supabaseClient.from('tasks').update({ is_completed: status }).eq('id', id);
            fetchTasks();
        }

        async function deleteTask(id) {
            await supabaseClient.from('tasks').delete().eq('id', id);
            fetchTasks();
        }

        // --- 2. QUẢN LÝ DOANH SỐ ---
        async function fetchSales() {
            const { data, error } = await supabaseClient.from('sales').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);

            const listEl = document.getElementById('sales-list');
            listEl.innerHTML = '';
            let total = 0;

            data.forEach(item => {
                total += Number(item.amount);
                listEl.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-medium">${item.client_name}</td>
                        <td class="p-3 text-amber-600 font-semibold">${Number(item.amount).toLocaleString()} VNĐ</td>
                        <td class="p-3 text-gray-500 text-xs">${new Date(item.created_at).toLocaleDateString('vi-VN')}</td>
                        <td class="p-3 text-right">
                            <button onclick="deleteSales(${item.id})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('total-sales').innerText = `Tổng doanh số: ${total.toLocaleString()} VNĐ`;
        }

        document.getElementById('sales-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const client_name = document.getElementById('sales-client').value;
            const amount = document.getElementById('sales-amount').value;
            const { error } = await supabaseClient.from('sales').insert([{ client_name, amount, user_id: currentUser.id }]);
            if (!error) {
                document.getElementById('sales-client').value = '';
                document.getElementById('sales-amount').value = '';
                fetchSales();
            }
        });

        async function deleteSales(id) {
            await supabaseClient.from('sales').delete().eq('id', id);
            fetchSales();
        }

        // --- 3. QUẢN LÝ CÔNG NỢ & NHẮC NỢ ---
        async function fetchDebts() {
            const { data, error } = await supabaseClient.from('debts').select('*').order('due_date', { ascending: true });
            if (error) return console.error(error);

            const listEl = document.getElementById('debt-list');
            listEl.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];

            data.forEach(item => {
                let isOverdue = item.due_date < today && !item.is_paid;
                listEl.innerHTML += `
                    <div class="p-3 border rounded-lg ${isOverdue ? 'bg-red-50 border-red-200' : 'bg-gray-50'}">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-sm text-gray-800">${item.client_name}</h4>
                                <p class="text-sm font-semibold text-red-600">${Number(item.amount).toLocaleString()} VNĐ</p>
                                <p class="text-xs text-gray-500 mt-1">Hạn: ${item.due_date} ${isOverdue ? '<span class="text-red-600 font-bold">(Quá hạn!)</span>' : ''}</p>
                            </div>
                            <div class="flex flex-col items-end space-y-1">
                                <button onclick="deleteDebt(${item.id})" class="text-gray-400 hover:text-red-600 text-xs"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('debt-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const client_name = document.getElementById('debt-client').value;
            const amount = document.getElementById('debt-amount').value;
            const due_date = document.getElementById('debt-duedate').value;
            const { error } = await supabaseClient.from('debts').insert([{ client_name, amount, due_date, user_id: currentUser.id }]);
            if (!error) {
                document.getElementById('debt-client').value = '';
                document.getElementById('debt-amount').value = '';
                document.getElementById('debt-duedate').value = '';
                fetchDebts();
            }
        });

        async function deleteDebt(id) {
            await supabaseClient.from('debts').delete().eq('id', id);
            fetchDebts();
        }

        // --- 4. TÍNH NĂNG XUẤT EXCEL (CSV) ---
        async function exportToExcel() {
            // Lấy dữ liệu doanh số để xuất file minh họa
            const { data: salesData } = await supabaseClient.from('sales').select('*');
            if (!salesData || salesData.length === 0) {
                alert("Không có dữ liệu doanh số để xuất!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // Thêm BOM để hiển thị đúng tiếng Việt trên Excel
            csvContent += "Khách hàng,Số tiền (VNĐ),Ngày ghi nhận\n";

            salesData.forEach(row => {
                csvContent += `"${row.client_name}",${row.amount},"${row.created_at}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Bao_Cao_Doanh_So.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        checkUser();
    </script>
</body>
</html>
